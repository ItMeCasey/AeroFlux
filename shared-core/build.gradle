// shared-core holds AeroFlux's game rules that need no Minecraft classes (tiers, collection
// math, dimension rules). The loader projects compile these sources directly, and this
// standalone build runs the unit tests without launching the game.
plugins {
    id 'java-library'
}

group = 'com.itmecasey.aeroflux'
version = '2026.11.1'

repositories {
    mavenCentral()
}

java {
    // Java 17 is the lowest level any of the six targets uses (Minecraft 1.20.1).
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    // Minecraft ships Gson on every version, so the loader builds already have it; this build
    // needs it to compile and test the foreign recipe reader on its own.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // The script bridge tests run real JavaScript in Rhino, the engine ModJS uses.
    testImplementation 'org.mozilla:rhino:1.7.15'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'passed'
        exceptionFormat = 'full'
    }
}
