plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Our own API jars (SMWTI, BEI) come from the private ItMeCasey Maven as com.itmecasey:<name>:<mc>-<loader>-<mod version>.
// Without the IMC_MAVEN_* login (forks, outside contributors) the build falls back to the jar in libs/.
def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
def imcMaven = imcUser && imcPass && !project.hasProperty('apiFromLibs')
if (imcMaven) {
    repositories {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'com.itmecasey' }
        }
    }
}

repositories {
    // FTB's own Maven, for the FTB Chunks API the protection layer is compiled against.
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter { includeGroup 'dev.ftb.mods' }
    }
    // Modrinth's Maven, for the optional mods AeroFlux talks to (Jade, The One Probe).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    // Jar name: aeroflux-<loader>-<minecraft version>-<YYYY.M.N>
    archivesName = 'aeroflux-neoforge-26.2'
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--uncached', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Since 26.1 assets (the run above) and data (tags, loot tables) are generated by separate runs.
        // runData finishes by running this one too, so a single command produces everything. Both runs
        // pass --uncached: with the cache on, each run would delete the other's files as stale.
        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--uncached', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Make the one data command cover both halves of generation.
tasks.named('runData') {
    finalizedBy 'runServerData'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// -PbeiCheck leaves the other mods out of the dev client, so a recipe viewer check shows AeroFlux with BEI alone.
def devMods = !project.hasProperty('beiCheck')
// -PdevOnly=jade (comma list) puts just those mods back into a -PbeiCheck run.
def devOnly = (project.findProperty('devOnly') ?: '').toString().split(',') as List

dependencies {
    // Look-at tooltips. Both are optional at play time: AeroFlux only registers its plugins when
    // they are installed. They are on the dev runtime too, so the plugins can be seen working.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (devMods || devOnly.contains('jade')) localRuntime "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:the-one-probe:${top_version}"
    if (devMods || devOnly.contains('the-one-probe')) localRuntime "maven.modrinth:the-one-probe:${top_version}"

    // Applied Energistics 2, for the ME and dense ME pipes. Optional like the two above.
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    if (devMods || devOnly.contains('ae2')) localRuntime "maven.modrinth:ae2:${ae2_version}"
    if (devMods || devOnly.contains('guideme')) localRuntime "maven.modrinth:guideme:${guideme_version}"

    // JEI, to show the machine recipes. Optional too.
    compileOnly "maven.modrinth:jei:${jei_version}"
    if (devMods || devOnly.contains('jei')) localRuntime "maven.modrinth:jei:${jei_version}"
    // Ex Deorum is only here so the self-test can read its real sieve and hammer recipes; AeroFlux
    // never compiles against it. It stays out of data generation, where it and AE2 both register
    // AE2's certus quartz crystal and the run stops.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') }) {
        if (devMods || devOnly.contains('ex-deorum')) localRuntime "maven.modrinth:ex-deorum:${exdeorum_version}"
    }


    // REI, the other recipe viewer. Compiled against only: the dev run already has JEI.
    compileOnly "maven.modrinth:rei:${rei_version}"
    compileOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    compileOnly "maven.modrinth:architectury-api:${architectury_version}"

    // WTHIT, the third look-at tooltip mod. Bad Packets is the library it needs.
    // BEI (Barely Enough Items), a recipe viewer of ours. Only its API is compiled against, from the jar
    // in libs (built by BEI's apiJar task); the viewer itself is an optional dependency.
    // SMWTI (Show Me What This Is), a look-at overlay of ours. Only its API is compiled against, from the jar
    // in libs (the api package of SMWTI's own jar); the overlay itself is an optional dependency.
    if (imcMaven) {
        compileOnly "com.itmecasey:smwti-api:26.2-neoforge-2026.11.3"
        compileOnly "com.itmecasey:bei-api:26.2-neoforge-2026.11.7"
    } else {
        compileOnly files('libs/smwti-api-26.2.jar', 'libs/bei-neoforge-26.2-2026.11.7-api.jar')
    }
    compileOnly "maven.modrinth:wthit:${wthit_version}"
    compileOnly "maven.modrinth:badpackets:${badpackets_version}"
    if (devMods || devOnly.contains('wthit')) localRuntime "maven.modrinth:wthit:${wthit_version}"
    if (devMods || devOnly.contains('badpackets')) localRuntime "maven.modrinth:badpackets:${badpackets_version}"

    // Claim mods, compiled against only: the protection layer loads their classes when they are
    // installed and never otherwise. Neither is on the dev runtime. FTB Chunks stands alone here
    // (no transitive jars), because only its own interfaces are called.
    compileOnly "maven.modrinth:open-parties-and-claims:${opac_version}"
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftbchunks_version}") { transitive = false }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Game rules shared by every AeroFlux build (tiers, collection math, dimension rules)
// live in /shared-core and contain no Minecraft classes, so each project compiles them directly.
sourceSets.main.java.srcDir '../../../shared-core/src/main/java'
