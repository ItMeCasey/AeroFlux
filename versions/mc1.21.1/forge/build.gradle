// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version

// Jar name: aeroflux-<loader>-<minecraft version>-<YYYY.M.N>
base {
    archivesName = 'aeroflux-forge-1.21.1'
}
group = mod_group_id

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', 'aeroflux'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'aeroflux', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    // Modrinth's Maven, for the claim mod the protection layer talks to when it is installed.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // Open Parties and Claims, compiled against only: the protection layer loads its classes when it is
    // installed and never otherwise. It is not on the dev runtime, and only its own API interfaces are
    // called, so its (obfuscated) jar needs no remapping. FTB Chunks has no Forge build for 1.21.1
    // (its Forge line stops at 1.20.4), so only Open Parties and Claims is bridged here.
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }

    // Recipe viewer and look-at tooltip mods with a Forge build for 1.21.1, compiled against only.
    // Like Open Parties and Claims they are not on the dev runtime: ForgeGradle 7's mavenizer cannot
    // remap a mod jar yet. The others AeroFlux supports elsewhere (REI, EMI, Jade, The One Probe,
    // KubeJS, CraftTweaker, AE2, Mekanism, Create) have no Forge build for 1.21.1.
    compileOnly("maven.modrinth:jei:${jei_version}") { transitive = false }
}

// mods.toml and pack.mcmeta are templates: this fills in their ${} values from gradle.properties
// (a missing one is an error) and adds the result to the jar's resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

// Game rules shared by every AeroFlux build (tiers, collection math, dimension rules)
// live in /shared-core and contain no Minecraft classes, so each project compiles them directly.
sourceSets.main.java.srcDir '../../../shared-core/src/main/java'
