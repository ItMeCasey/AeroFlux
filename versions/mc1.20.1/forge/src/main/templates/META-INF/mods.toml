    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="wthit"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Machine recipes from scripts.
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="crafttweaker"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
