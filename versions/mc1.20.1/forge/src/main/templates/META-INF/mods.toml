# AeroFlux metadata for Forge 1.20.1. generateModMetadata in build.gradle fills in the
# placeholders from gradle.properties, so a release only changes mod_version there.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ItMeCasey/AeroFlux/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ItMeCasey/AeroFlux"
logoFile="aeroflux.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional mods. AeroFlux checks for each one at startup and only then turns its support on,
# so none of them is needed to play. Listing them here loads AeroFlux after them.

# Recipe viewers, client only.
[[dependencies.${mod_id}]]
    modId="smwti"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="bei"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# Look-at tooltips. All three send block data from the server, so they count on both sides.
[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
