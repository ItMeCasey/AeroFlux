name: Mod compatibility
description: AeroFlux does not work with, or should support, another mod
labels: ["compatibility"]
body:
  - type: input
    id: other-mod
    attributes:
      label: Which mod?
      description: Name and version, with a link if you have one.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is the problem or request?
      options:
        - Something breaks when both are installed
        - Pipes do not connect to it
        - Recipes from it do not show up in AeroFlux machines
        - Overlay or recipe viewer support (Jade, JEI, and so on)
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happens, and what should happen? Add steps if something breaks.
    validations:
      required: true
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - 26.1.2
        - 1.21.1
        - 1.20.1
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - NeoForge
        - Forge
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: AeroFlux version
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Log or crash report link
      description: Upload it to https://mclo.gs and paste the link.
    validations:
      required: false
