name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Picks what this push or pull request needs (.github/scripts/plan_matrix.py): only the builds whose files
  # changed, every build when shared-core/src/main/java changed, nothing for docs, status and workflow changes.
  plan:
    name: Pick the builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 -I .github/scripts/plan_matrix.py build --before "$PR_BASE" --sha "$PR_HEAD"
          else
            python3 -I .github/scripts/plan_matrix.py build --before "$BEFORE" --sha "$SHA"
          fi

  # Unit tests and the translation check run when shared-core, lang/ or a build's language files changed.
  shared-core:
    name: Unit tests (shared-core)
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run tests
        working-directory: shared-core
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      # Translations: no unknown keys and no broken placeholders (see TRANSLATING.md).
      - name: Check translations
        run: python3 assets-src/tools/lang_sync.py check

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Gradle runs on the last JDK listed and its toolchain support finds the project's own
      # Java version among the others. Forge 1.21.1 and 26.1.2 also want Java 8 for run tasks.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
          cache: gradle
      - name: Build jar
        working-directory: ${{ matrix.dir }}
        env:
          IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
          IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aeroflux-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*.jar

  # Starts each build's dev server with the in-game self-test switched on. The self-test builds
  # its test layers in a fresh world, logs a PASS or FAIL line per check and a RESULT summary,
  # then stops the server itself; the timeout only catches a server that hangs.
  selftest:
    name: Self-test ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Same JDKs as the build job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
          cache: gradle
      - name: Run the server self-test
        working-directory: ${{ matrix.dir }}
        env:
          IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
          IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
          AEROFLUX_SELFTEST: "1"
          SELFTEST_PORT: "25599"
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'server-port=%s\nonline-mode=false\n' "$SELFTEST_PORT" > run/server.properties

          # The dev server's exit code says nothing useful (it is halted, not stopped), so the
          # verdict comes from the RESULT line alone.
          set +e
          timeout --kill-after=1m 25m ./gradlew runServer --no-daemon > selftest.log 2>&1
          status=$?
          set -e

          if grep -Eq 'AEROFLUX-SELFTEST RESULT passed=[1-9][0-9]* failed=0' selftest.log; then
            grep -E 'AEROFLUX-SELFTEST RESULT' selftest.log
            exit 0
          fi

          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::The self-test did not finish within 25 minutes."
          fi
          if grep -q 'AEROFLUX-SELFTEST' selftest.log; then
            grep -E 'AEROFLUX-SELFTEST (FAIL|RESULT)' selftest.log || true
            echo "::error::The self-test reported failures."
          else
            echo "::error::The self-test never ran (gradle exited with $status). Last lines of the log:"
            tail -n 80 selftest.log
          fi
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log-${{ matrix.name }}
          path: ${{ matrix.dir }}/selftest.log
          if-no-files-found: ignore
