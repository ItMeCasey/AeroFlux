org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge. The ranges go into META-INF/mods.toml.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
forge_version=66.1.5
forge_version_range=[66,)
loader_version_range=[66,)

# Mod properties. They fill in the templates under src/main/templates, so a release only
# changes mod_version here.
mod_id=aeroflux
mod_name=AeroFlux
mod_license=MIT
mod_version=2026.11.8
mod_group_id=com.itmecasey.aeroflux
mod_authors=ItMeCasey
mod_description=Collect Aero Flux from the sun by day and Moon Flux from the moon by night, then pipe them into tiered machines, tanks, converters and chunk loaders.
# Claim mod the protection layer asks directly when it is installed (compile only): forge-26.1.2-0.33.0.
opac_version=kvQ7M7h5
# WTHIT (with Bad Packets, which it needs), Modrinth version ids for 26.1.2 Forge.
