# AeroFlux metadata for NeoForge 1.21.1. generateModMetadata in build.gradle fills in the
# placeholders from gradle.properties, so a release only changes mod_version there.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ItMeCasey/AeroFlux/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ItMeCasey/AeroFlux"
logoFile="aeroflux.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional mods. AeroFlux checks for each one at startup and only then turns its support on,
# so none of them is needed to play. Listing them here loads AeroFlux after them.

# Recipe viewers, client only.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# Look-at tooltips. Both send block data from the server, so they count on both sides.
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="theoneprobe"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Machine recipes from scripts.
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# ME pipes and the AE converter.
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Chemical (gas) pipes.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Sieve mods. The Sifter runs their sieve recipes and is only craftable with one installed.
[[dependencies.${mod_id}]]
    modId="exdeorum"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="exnihilosequentia"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
