# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[64,)"
license="MIT"
issueTrackerURL="https://github.com/ItMeCasey/AeroFlux/issues" #optional
#clientSideOnly=true #optional, default=false

[[mods]]
modId="aeroflux"
version="2026.11.1"
displayName="AeroFlux"
#updateJSONURL="https://example.com/updates.json" #optional
displayURL="https://github.com/ItMeCasey/AeroFlux" #optional
logoFile="aeroflux.png" #optional
#credits="" #optional
authors="ItMeCasey" #optional
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''Collect Aero Flux from the sun by day and Moon Flux from the moon by night, then pipe them into tiered machines, tanks, converters and chunk loaders.'''

[[dependencies.aeroflux]] #recommended
    modId="forge"
    mandatory=true
    versionRange="[64,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aeroflux]] #recommended
    modId="minecraft"
    mandatory=true
    versionRange="[26.1.2,26.2,)"
    ordering="NONE"
    side="BOTH"
